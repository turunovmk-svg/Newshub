name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-3.22.0'
          
      - name: Install Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --licenses > /dev/null
          $ANDROID_SDK_ROOT/tools/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > $HOME/.android/local.properties
          
      - name: Install Flutter dependencies
        run: |
          flutter config --no-analytics
          flutter pub get
          
      - name: Enable Kotlin
        run: |
          flutter create --platforms=android .
          
      - name: Build APK
        run: |
          flutter build apk --release
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: newshub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push'
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: release
          name: NewsHub v1.0.0
