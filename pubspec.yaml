name: newshub
description: "NewsHub - Профессиональный RSS-агрегатор новостей для Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  xml: ^6.5.0
  html: ^0.15.4
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.5.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
